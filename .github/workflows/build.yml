name: APK bouwen

# Elke push naar main levert een testversie (pre-release build-N).
# Een tag als v1.1.0 levert een echte release met APK en AAB (voor IzzyOnDroid en Google Play).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Versie bepalen
        run: |
          version=$(grep -oP 'versionName = "\K[0-9.]+' app/build.gradle.kts)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_ENV"
          if [ "$IS_RELEASE" = "true" ]; then
            if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} past niet bij versionName $version in app/build.gradle.kts."
              exit 1
            fi
            echo "APK_NAME=takenlijst-$version" >> "$GITHUB_ENV"
          else
            echo "VERSION_SUFFIX=-build.${{ github.run_number }}" >> "$GITHUB_ENV"
            echo "APK_NAME=takenlijst-$version-build.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Ondertekeningssleutel klaarzetten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Geen KEYSTORE_BASE64-secret: APK wordt met een tijdelijke sleutel ondertekend en er komt geen release."
          fi

      # Duidelijke foutmelding als het secret een andere sleutel bevat (bijv. die van een andere app).
      - name: Sleutel controleren
        if: env.KEYSTORE_FILE != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          aliases=$(keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" | grep PrivateKeyEntry | cut -d, -f1)
          echo "Sleutels in het secret: $aliases"
          if ! echo "$aliases" | grep -qx takenlijst; then
            echo "::error::KEYSTORE_BASE64 bevat geen sleutel 'takenlijst' maar: $aliases. Gebruik de bestanden uit Takenlijst/signing."
            exit 1
          fi

      - name: Tests draaien
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: APK en AAB bouwen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Bestanden hernoemen
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$APK_NAME.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: |
            ${{ env.APK_NAME }}.apk
            ${{ env.APK_NAME }}.aab

      # Alleen met de vaste sleutel publiceren, anders installeren updates niet over elkaar heen.
      - name: Testversie publiceren
        if: env.KEYSTORE_FILE != '' && env.IS_RELEASE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Testversie ${{ env.VERSION }}-build.${{ github.run_number }}
          prerelease: true
          files: ${{ env.APK_NAME }}.apk

      - name: Release publiceren
        if: env.KEYSTORE_FILE != '' && env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Takenlijst ${{ env.VERSION }}
          body_path: fastlane/metadata/android/nl-NL/changelogs/${{ env.VERSION_CODE }}.txt
          files: |
            ${{ env.APK_NAME }}.apk
            ${{ env.APK_NAME }}.aab
