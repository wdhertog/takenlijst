name: APK bouwen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Ondertekeningssleutel klaarzetten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Geen KEYSTORE_BASE64-secret: APK wordt met een tijdelijke sleutel ondertekend en er komt geen release."
          fi

      - name: Tests draaien
        run: gradle testDebugUnitTest --stacktrace

      - name: APK bouwen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: APK hernoemen
        run: cp app/build/outputs/apk/release/app-release.apk "takenlijst-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: takenlijst-${{ github.run_number }}
          path: takenlijst-${{ github.run_number }}.apk

      # Alleen met de vaste sleutel publiceren, anders installeren updates niet over elkaar heen.
      - name: Release publiceren
        if: env.KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Takenlijst 1.0.${{ github.run_number }}
          files: takenlijst-${{ github.run_number }}.apk
